name: meal_meat_user
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  injectable: ^3.0.0
  retrofit: ^4.9.2
  dio: ^5.9.2
  font_awesome_flutter: ^11.0.0
  flutter_secure_storage: ^10.3.1
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^3.5.1
  get_it: ^8.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  flutter_bloc: ^8.1.6
  lottie: ^3.1.2
  cherry_toast: ^1.13.0
  native_glass_navbar: ^1.0.2
  device_preview: ^1.3.1
  animations: ^2.2.0
  flutter_zoom_drawer: ^3.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter


 
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.6

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/fake/
    - assets/images/fake/calendar/
    - assets/images/fake/home/
    - assets/images/fake/meal_details/
    - assets/images/fake/offers/
    - assets/images/fake/subscriptions/
    - assets/animations/
    - assets/images/home/figma/
    - assets/images/offers/
    - assets/images/calendar/figma/
    - assets/images/meal_details/figma/
    - assets/images/subscriptions/
    - assets/images/subscriptions/figma/
    - assets/images/svg/

  fonts:
  - family: IBMPlexSansArabic
    fonts:
      - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        weight: 400
      - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
        weight: 500
      - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
        weight: 700
